<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playwright Cookbook — Quest Fixture</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; }
    button { min-height: 2.75rem; padding: .6rem 1rem; margin: .25rem; }
    li[data-complete="true"] { text-decoration: line-through; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Lantern Trail: Test Quest</h1>
    <p>A synthetic quest fixture. No accounts, location, or network service are used.</p>
    <button type="button" id="start-quest">Start quest</button>
    <section aria-labelledby="objectives-heading">
      <h2 id="objectives-heading">Objectives</h2>
      <ol>
        <li data-objective="lantern" data-complete="false">Find the lantern</li>
        <li data-objective="riddle" data-complete="false">Solve the riddle</li>
      </ol>
    </section>
    <button type="button" id="find-lantern" disabled>Find lantern</button>
    <button type="button" id="solve-riddle" disabled>Solve riddle</button>
    <p id="status" role="status" aria-live="polite">Quest not started.</p>
    <p id="reward" hidden>Demo reward unlocked.</p>
  </main>
  <script>
    (() => {
      const start = document.querySelector("#start-quest");
      const lantern = document.querySelector("#find-lantern");
      const riddle = document.querySelector("#solve-riddle");
      const status = document.querySelector("#status");
      const reward = document.querySelector("#reward");
      const objective = (name) => document.querySelector('[data-objective="' + name + '"]');
      const storageKey = "zqm-playwright-cookbook.quest.v1";
      const readProgress = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
          if (!saved || saved.version !== 1 || typeof saved.started !== "boolean" ||
              typeof saved.lanternComplete !== "boolean" || typeof saved.riddleComplete !== "boolean" ||
              (saved.riddleComplete && !saved.lanternComplete) ||
              (saved.lanternComplete && !saved.started)) return null;
          return saved;
        } catch {
          return null;
        }
      };
      let progress = readProgress() || {
        version: 1, started: false, lanternComplete: false, riddleComplete: false,
      };
      const persist = () => {
        try { localStorage.setItem(storageKey, JSON.stringify(progress)); } catch { /* Storage may be unavailable. */ }
      };
      const render = () => {
        start.disabled = progress.started;
        lantern.disabled = !progress.started || progress.lanternComplete;
        riddle.disabled = !progress.lanternComplete || progress.riddleComplete;
        objective("lantern").dataset.complete = String(progress.lanternComplete);
        objective("riddle").dataset.complete = String(progress.riddleComplete);
        reward.hidden = !progress.riddleComplete;
        if (progress.riddleComplete) status.textContent = "Quest complete. Demo reward unlocked.";
        else if (progress.lanternComplete) status.textContent = "Lantern found. Solve the riddle.";
        else if (progress.started) status.textContent = "Quest started. Find the lantern.";
        else status.textContent = "Quest not started.";
      };
      start.addEventListener("click", () => {
        if (progress.started) return;
        progress.started = true;
        persist();
        render();
      });
      lantern.addEventListener("click", () => {
        if (!progress.started || progress.lanternComplete) return;
        progress.lanternComplete = true;
        persist();
        render();
      });
      riddle.addEventListener("click", () => {
        if (!progress.started || !progress.lanternComplete || progress.riddleComplete) return;
        progress.riddleComplete = true;
        persist();
        render();
      });
      render();
    })();
  </script>
</body>
</html>
